[workspace]
package.edition = "2024"
resolver = "2"
members = [
    "backend/app",
    "backend/domain",
    "backend/axum",
    "backend/strava",
    "backend/sqlx",
    "backend/exec",
]

[workspace.dependencies]

tb_domain = { path = "./backend/domain" }
tb_axum = { path = "./backend/axum" }
tb_strava = { path = "./backend/strava" }
tb_sqlx = { path = "./backend/sqlx" }
tb_exec = { path = "./backend/exec" }

anyhow = "1.0"
async-recursion = "1"
async-trait = "^0.1"
derive_more = "2"
log = "0.4"
mockall = "0.15"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0.111"
serde_with = "3"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.44.2", features = ["macros", "rt"] }
uuid = "1.7.0"
oauth2 = "5.0.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "brotli", "deflate", "zstd"] }

# Shared across multiple crates; minimal common feature set lives here,
# each crate adds its own extras on top via `features = [...]`.
http = "1"
sqlx = { version = "0.8", features = ["postgres"] }
dotenvy = "0.15"
