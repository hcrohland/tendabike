name: Test
permissions:
  contents: read
  actions: read

on:
  #   push:
  #     branches: [ "main" ]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  svelte:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          #node-version: 21
          cache: npm
      - run: npm install
      - name: Format check
        run: npm run fmtcheck
      - name: Check
        run: npm run check:ci
      - name: Test
        run: npm run test

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Test
        run: cargo test --release

  # Store seam integration suite (issue #406) against a real Postgres.
  # Required gate: the two store adapters are unified on the database's
  # rules (#407-#410), so a red seam blocks the PR (issue #411). The suite
  # skips itself when no SCRATCH_DATABASE_URL is configured, which only
  # happens outside this job — it always sets one below.
  postgres-seam:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tendabike
          POSTGRES_PASSWORD: tendabike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendabike"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The suite force-drops any database left behind by a previous run,
      # then creates and seeds this scratch database itself; the service
      # needs no POSTGRES_DB.
      SCRATCH_DATABASE_URL: postgres://tendabike:tendabike@localhost:5432/tendabike_test
      # Compile against the committed .sqlx offline cache: the scratch
      # database is created by the suite at runtime and only gets its
      # schema when the pool runs the migrations, so a live compile-time
      # query check would fail.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p tb_sqlx --test store_seam
