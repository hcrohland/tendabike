name: CI
permissions: 
  contents: read
  actions: read
  packages: write
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
env:
  CARGO_TERM_COLOR: always

jobs:  
  docker:
    runs-on: ubuntu-latest

    env: 
      TAG: ${{ github.event_name == 'pull_request' && format('PR_{0}, ghcr.io/hcrohland/tendabike:staging', github.event.pull_request.number) || 'latest'}}
    steps:
    - 
      uses: actions/checkout@v6
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - 
      name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    -
      name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        file: Dockerfile
        tags: ghcr.io/hcrohland/tendabike:${{ env.TAG }}
        context: .
        # GHA remote cache. Buildkit namespaces the index key by the
        # run's ref (the runner token's access scope is hashed into it),
        # so this cache is per-branch, not repo-wide: a branch shares
        # its layers (base, build-deps target, frontend) across runners
        # and re-runs, while a new branch starts cold once. mode=max
        # persists the intermediate build-deps layer that makes new
        # commits build incrementally.
        cache-from: type=gha,mode=max
        cache-to: type=gha,mode=max
    - 
      name: Verify the image carries the real binary
      # The stubbed main (fn main() {}) exits 0 silently, while the real
      # binary fails fast without a reachable database. A 0 exit here
      # means the stub from the build-deps stage was shipped.
      run: |
        set -uo pipefail
        set +e
        docker run --rm "$TAG" > run.log 2>&1
        status=$?
        set -e
        echo "--- container output (exit $status) ---" > run.log
        cat run.log
        case "$status" in
          0)
            echo "::error::entrypoint exited 0: the stub binary was shipped, not the real one"
            exit 1
            ;;
          125|126|127)
            echo "::error::docker could not run the image (exit $status)"
            exit 1
            ;;
        esac
        echo "Binary failed as expected without a database; real binary confirmed."
      
