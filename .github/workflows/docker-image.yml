name: CI
permissions: 
  contents: read
  actions: read
  packages: write
  
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
env:
  CARGO_TERM_COLOR: always

jobs:  
  docker:
    runs-on: ubuntu-latest

    env: 
      TAG: ${{ github.event_name == 'pull_request' && format('PR_{0}, ghcr.io/hcrohland/tendabike:staging', github.event.pull_request.number) || 'latest'}}
    steps:
    - 
      uses: actions/checkout@v6
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - 
      name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    -
      name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        file: Dockerfile
        tags: ghcr.io/hcrohland/tendabike:${{ env.TAG }}
        context: .
        # GHA remote cache. Buildkit namespaces the index key by the
        # run's ref (the runner token's access scope is hashed into it),
        # so this cache is per-branch, not repo-wide: a branch shares
        # its layers (base, build-deps target, frontend) across runners
        # and re-runs, while a new branch starts cold once. mode=max
        # persists the intermediate build-deps layer that makes new
        # commits build incrementally.
        cache-from: type=gha,mode=max
        cache-to: type=gha,mode=max
      
