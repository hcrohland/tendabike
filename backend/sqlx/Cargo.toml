[package]
name = "tb_sqlx"
version = "0.9.0"
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "time",
    "uuid",
    "macros",
] }
tokio = { workspace = true, features = ["rt", "sync"] }
async-trait = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }
tb_strava = { workspace = true }
tb_exec = { workspace = true }
tb_domain = { workspace = true }
uuid = { workspace = true }
oauth2 = { workspace = true }

[lib]
doctest = false

[dev-dependencies]
tb_domain = { workspace = true, features = ["test-support"] }
tb_strava = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["runtime-tokio", "time", "uuid", "macros", "chrono"] }
dotenvy = { workspace = true }
serde = { workspace = true }
