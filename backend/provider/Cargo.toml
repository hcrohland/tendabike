[package]
name = "tb_provider"
version = "0.9.0"
authors = ["Christoph Rohland <tendabike@rohland.net>"]
edition = { workspace = true }

[dependencies]
tb_domain = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
log = { workspace = true }
time = { workspace = true, features = ["serde"] }
mockall = { workspace = true, optional = true }

# Provider-specific dependencies (gated on the `strava` / `icu` features).
# `reqwest` is reached through `oauth2`'s `reqwest` re-export (the kit's
# shared client), so it is not a direct dependency.
oauth2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["from", "into", "display"], optional = true }

[features]
default = ["strava", "icu"]
strava = [
    "dep:oauth2",
    "dep:serde",
    "dep:serde_derive",
    "dep:serde_json",
    "dep:anyhow",
    "dep:derive_more",
]
icu = [
    "dep:oauth2",
    "dep:serde",
    "dep:serde_derive",
    "dep:serde_json",
    "dep:anyhow",
    "dep:derive_more",
]
test-support = ["dep:mockall", "tb_domain/test-support"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tb_domain = { workspace = true, features = ["test-support"] }
mockall = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[lib]
doctest = false

[lints]
workspace = true
