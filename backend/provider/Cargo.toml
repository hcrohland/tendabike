[package]
name = "tb_provider"
version = "0.9.0"
authors = ["Christoph Rohland <tendabike@rohland.net>"]
edition = { workspace = true }

[dependencies]
tb_domain = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
log = { workspace = true }
time = { workspace = true, features = ["serde"] }
mockall = { workspace = true, optional = true }

# Strava-specific dependencies (gated on the `strava` feature)
reqwest = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["from", "into", "display"], optional = true }
async-recursion = { workspace = true, optional = true }

[features]
default = ["strava"]
strava = [
    "dep:reqwest",
    "dep:oauth2",
    "dep:serde",
    "dep:serde_derive",
    "dep:serde_json",
    "dep:anyhow",
    "dep:derive_more",
    "dep:async-recursion",
]
test-support = ["dep:mockall"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tb_domain = { workspace = true, features = ["test-support"] }
mockall = { workspace = true }

[lib]
doctest = false
