[package]
name = "tb_domain"
version = "0.9.0"
authors = ["Christoph Rohland <tendabike@rohland.net>"]
edition = { workspace = true }

[features]
test-support = ["dep:tokio", "dep:mockall"]

[[bin]]
name = "build-snapshot"
path = "src/bin/build_snapshot.rs"
required-features = ["test-support"]

[dependencies]

csv = "1.3"

derive_more = { workspace = true, features = ["from", "into", "display"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_derive = { workspace = true }
serde_with = { workspace = true, features = ["time_0_3"] }

time = { workspace = true, features = [
    "serde",
    "parsing",
    "serde-human-readable",
    "macros",
] }

thiserror = { workspace = true }
anyhow = { workspace = true }

async-trait = { workspace = true }
uuid = { workspace = true, features = [
    "v7",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
time = { workspace = true, features = ["serde"] }
mockall = { workspace = true }

[lib]
doctest = false
