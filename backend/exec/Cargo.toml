[package]
name = "tb_exec"
version = "0.9.0"
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tb_domain = { workspace = true }
tb_strava = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
oauth2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
mockall = { workspace = true, optional = true }

[features]
mock = ["dep:mockall"]

[lib]
doctest = false

[dev-dependencies]
# `mockall` is a dev-dependency of `tb_exec` only: the `#[cfg(test)]`
# connection witness (the `MockConn` in `executor_tests`) is generated by
# `mock!`, and no production `pub` item is widened by it. (The optional
# `mock` feature above is a separate concern: it gates `MockServiceApi` for
# the web layer's contract suite.)
mockall = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tb_domain = { workspace = true, features = ["test-support"] }
tb_strava = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
time = { workspace = true }
uuid = { workspace = true }
