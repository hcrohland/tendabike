[package]
name = "tb_axum"
version = "0.9.0"
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tb_domain = { workspace = true }
tb_strava = { workspace = true }
tb_sqlx = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
hmac = "*"
sha2 = "*"
base64 = "*"
rand = "0.10"
axum = { version = "0.8", features = ["macros"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["full"] }
# 0.15 fails on deletion-task...
# tower-sessions = { version = "0.15", features = ["deletion-task"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
axum-macros = "0.5"

oauth2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["time_0_3"] }
time = { workspace = true, features = [
    "serde",
    "parsing",
    "serde-human-readable",
] }
tokio = { workspace = true }
hex = "0.4.3"

[dev-dependencies]
# "full" because the test code needs tokio's `macros`/`rt` features, which are
# not guaranteed when building only tb_axum's own dependency graph
tokio = { workspace = true, features = ["full"] }
# `memory-store` is only used by the tests; declared here rather than in
# [dependencies] so it is not enabled when tb_axum is consumed as a regular
# dependency (workspace-root builds still unify it in, per cargo's
# workspace-wide feature resolution, but the type is dead code there)
tower-sessions = { version = "0.14", features = ["memory-store"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }

[lib]
doctest = false
