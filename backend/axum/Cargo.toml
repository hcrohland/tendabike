[package]
name = "tb_axum"
version = "0.9.0"
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tb_domain = { workspace = true }
tb_strava = { workspace = true }
tb_exec = { workspace = true }

reqwest = { workspace = true }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
axum = { version = "0.8", features = ["macros", "multipart"] }
futures = "0.3"
http = { workspace = true }
tracing = "0.1"
tower-http = { version = "0.7", features = ["full"] }
# Pinned to 0.14: the latest tower-sessions-sqlx-store (0.15.0) is built
# against tower-sessions 0.14, so bumping to 0.15 leaves PostgresStore
# implementing the 0.14 SessionStore trait (a type mismatch at the layer).
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
sqlx = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-macros = "0.5"

oauth2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["time_0_3"] }
time = { workspace = true, features = [
    "serde",
    "parsing",
    "serde-human-readable",
] }
tokio = { workspace = true, features = [
    "net",
    "signal",
    "sync",
    "time",
    "rt-multi-thread",
] }
hex = "0.4.3"

[dev-dependencies]
# "full" because the test code needs tokio's `macros`/`rt` features, which are
# not guaranteed when building only tb_axum's own dependency graph
tokio = { workspace = true, features = ["full"] }
tb_exec = { workspace = true, features = ["mock"] }
# `memory-store` is only used by the tests; declared here rather than in
# [dependencies] so it is not enabled when tb_axum is consumed as a regular
# dependency (workspace-root builds still unify it in, per cargo's
# workspace-wide feature resolution, but the type is dead code there)
tower-sessions = { version = "0.14", features = ["memory-store"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }

[lib]
doctest = false
