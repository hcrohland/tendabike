services:
  database:
    image: postgres:18-alpine
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=tendabike
      - POSTGRES_PASSWORD=localonly
      - POSTGRES_DB=tendabike
    network_mode: service:app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "5173:5173"
    volumes:
      - home:/home/pythia
      - agentcontainer_workspaces:/workspaces
    command: sleep infinity
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - DATABASE_URL=postgres://tendabike@localhost/tendabike
      - SCRATCH_DATABASE_URL=postgres://tendabike@localhost/scratch
      - SSH_AUTH_SOCK=/tmp/ssh-agent-pythia.sock

volumes:
  postgres-data:
  home:
  agentcontainer_workspaces:
    external: true
