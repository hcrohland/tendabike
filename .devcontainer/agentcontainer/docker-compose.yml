services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=tendabike
      - POSTGRES_PASSWORD=localonly
      - POSTGRES_DB=tendabike
    network_mode: service:app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - home:/home/laios
      - agentcontainer_workspaces:/workspaces
    command: sleep infinity
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - DATABASE_URL=postgres://tendabike@localhost/tendabike
      - SCRATCH_DATABASE_URL=postgres://tendabike@localhost/scratch
      - SSH_AUTH_SOCK=/tmp/ssh-agent-laios.sock
      - PYTHIA_API_KEY=${PYTHIA_API_KEY}
      - DELPHI_API_KEY=${DELPHI_API_KEY}
      - GITHUB_PAT=${GITHUB_PAT}
      - EDITOR=vi

volumes:
  postgres-data:
  home:
  agentcontainer_workspaces:
    external: true
