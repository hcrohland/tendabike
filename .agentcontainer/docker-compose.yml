services:
  database:
    image: postgres:18-alpine
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file: .env
    # "database" nutzt jetzt den Netzwerk-Stack von "app" (statt umgekehrt).
    # Docker Compose startet "app" dadurch implizit zuerst.
    network_mode: service:app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    # Port-Publishing steht jetzt hier, da "app" der Besitzer des
    # Netzwerk-Stacks ist, den "database" sich mit anmietet.
    ports:
      - "5173:5173"
    volumes:
      - home:/home/pythia
      - .:/home/pythia/src
      - workspaces:/workspaces
    command: sleep infinity
    environment:
      - TZ=Europe/Berlin

volumes:
  postgres-data:
  workspaces:
  home:
